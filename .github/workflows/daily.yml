# Tägliche Empfehlung / raccomandazione giornaliera.
# Läuft Mo–Fr um 05:17 UTC (= 06:17 MEZ / 07:17 MESZ), also lange vor dem Tipp-Schluss um 12:00.
# Cron-Läufe können sich bei GitHub verspäten oder bei hoher Last ganz ausfallen (besonders zur
# vollen Stunde) – deshalb eine krumme Minute und ein Ersatzlauf um 07:47 UTC (08:47 MEZ /
# 09:47 MESZ), der nur rechnet, wenn heute noch kein Lauf die Empfehlung aktualisiert hat.
name: daily

on:
  schedule:
    - cron: '17 5 * * 1-5'
    - cron: '47 7 * * 1-5'   # Ersatzlauf (siehe Schritt "Schon aktuell?")
  workflow_dispatch:

permissions:
  contents: write

# Gemeinsame Gruppe mit on-data.yml: nie zwei Pipeline-Läufe gleichzeitig (sonst Push-Konflikte).
# Laufende Läufe werden nicht abgebrochen; von mehreren wartenden Läufen bleibt nur der neueste.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Ersatzlauf: nichts tun, wenn today.json heute (Europe/Rome) schon neu geschrieben wurde –
      # vom Frühlauf oder von on-data nach einer Eingabe. Geprüft wird das Commit-Datum (klappt
      # auch mit verschlüsselten Daten).
      - name: Schon aktuell?
        id: fresh
        if: github.event_name == 'schedule' && github.event.schedule == '47 7 * * 1-5'
        run: |
          last=$(TZ=Europe/Rome git log -1 --format=%cd --date=format-local:%F -- docs/data/today.json)
          today=$(TZ=Europe/Rome date +%F)
          if [ "$last" = "$today" ]; then
            echo "today.json wurde heute schon aktualisiert ($last) – Ersatzlauf nicht nötig."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.fresh.outputs.skip != 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: steps.fresh.outputs.skip != 'true'
        run: python -m pip install -r requirements.txt

      - name: Pipeline (--daily)
        if: steps.fresh.outputs.skip != 'true'
        env:
          # optional: verschlüsselt docs/data/*.json (AES-GCM); leer = unverschlüsselt
          SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
        run: python -m engine.pipeline --daily

      - name: Commit & push
        id: push
        if: steps.fresh.outputs.skip != 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for p in docs/data reports data/*.csv data/state.json data/model_params.json; do
            if [ -e "$p" ] || git ls-files --error-unmatch -- "$p" >/dev/null 2>&1; then
              git add -A -- "$p"
            fi
          done
          if git diff --cached --quiet; then
            echo "Keine Änderungen – nichts zu committen."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Tägliche Empfehlung $(TZ=Europe/Rome date +%F)"
          # Push; bei Ablehnung git pull --rebase und bis zu 3 neue Versuche.
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:$BRANCH"; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then break; fi
            echo "Push abgelehnt (Versuch $attempt) – git pull --rebase …"
            sleep $((attempt * 5))
            if ! git pull --rebase origin "$BRANCH"; then
              git rebase --abort || true
              echo "::warning::Konflikt mit neueren Commits auf $BRANCH – Ergebnis verworfen. Der durch den neuen Push ausgelöste on-data-Lauf (bzw. der nächste daily-Lauf) rechnet alles neu."
              exit 0
            fi
          done
          echo "::error::Push nach 3 Wiederholungen fehlgeschlagen"
          exit 1

  # Nur wenn Settings → Pages → Source = "GitHub Actions" und Repo-Variable PAGES_MODE=actions.
  # Standard ist "Deploy from a branch: main /docs" – dann baut GitHub Pages selbst nach jedem Push.
  deploy:
    needs: build
    if: vars.PAGES_MODE == 'actions' && github.ref == 'refs/heads/main' && needs.build.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # der vom build-Job gepushte Commit (nicht der, der den Lauf ausgelöst hat)
          ref: ${{ needs.build.outputs.sha || 'main' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
