# Tests für Pull Requests und Pushes auf andere Branches als main
# (auf main laufen die Tests im on-data-Workflow nach der Pipeline).
name: tests

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: pytest
        run: python -m pytest -q

  # JS-Tests des Piano (docs/piano-core.js, docs/piano/*.json, docs/i18n.js) – ohne Abhängigkeiten.
  # Node >= 22: Glob in Anführungszeichen (die Form "node --test tests/js" akzeptiert keinen Ordner).
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: node --test
        run: node --test "tests/js/*.test.js"
