# Neu rechnen, sobald sich Daten oder Engine ändern / ricalcolo quando cambiano dati o motore:
# Excel-Upload nach data/raw/, Bearbeitung von data/*.csv auf github.com, Eingabe über die Website.
#
# Keine Endlosschleife: Pushes, die mit dem GITHUB_TOKEN gemacht werden (der Commit unten),
# lösen nie neue Workflow-Läufe aus. Pushes der Website (persönlicher Token) dagegen schon.
name: on-data

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'engine/**'
      - 'requirements.txt'
      - '.github/workflows/on-data.yml'
  workflow_dispatch:
    inputs:
      tune:
        description: 'Hyper-Parameter neu optimieren (--tune, langsam)'
        type: boolean
        default: false
      force_ingest:
        description: 'Excel neu einlesen, auch wenn unverändert (--force-ingest)'
        type: boolean
        default: false

permissions:
  contents: write

# Gemeinsame Gruppe mit daily.yml: nie zwei Pipeline-Läufe gleichzeitig.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Pipeline
        env:
          # optional: verschlüsselt docs/data/*.json (AES-GCM); leer = unverschlüsselt
          SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
          TUNE: ${{ inputs.tune }}
          FORCE_INGEST: ${{ inputs.force_ingest }}
        run: |
          args=()
          if [ "$TUNE" = "true" ]; then args+=(--tune); fi
          if [ "$FORCE_INGEST" = "true" ]; then args+=(--force-ingest); fi
          echo "python -m engine.pipeline ${args[*]}"
          python -m engine.pipeline "${args[@]}"

      - name: Tests
        run: python -m pytest -q

      - name: Commit & push
        id: push
        env:
          BRANCH: ${{ github.ref_name }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for p in docs/data reports data/*.csv data/state.json data/model_params.json; do
            if [ -e "$p" ] || git ls-files --error-unmatch -- "$p" >/dev/null 2>&1; then
              git add -A -- "$p"
            fi
          done
          if git diff --cached --quiet; then
            echo "Keine Änderungen – nichts zu committen."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Daten neu berechnet (on-data, ${TRIGGER_SHA:0:7})"
          # Push; bei Ablehnung git pull --rebase und bis zu 3 neue Versuche.
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:$BRANCH"; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then break; fi
            echo "Push abgelehnt (Versuch $attempt) – git pull --rebase …"
            sleep $((attempt * 5))
            if ! git pull --rebase origin "$BRANCH"; then
              git rebase --abort || true
              echo "::warning::Konflikt mit neueren Commits auf $BRANCH – Ergebnis verworfen. Der durch den neuen Push ausgelöste Lauf rechnet alles neu."
              exit 0
            fi
          done
          echo "::error::Push nach 3 Wiederholungen fehlgeschlagen"
          exit 1

  # Nur wenn Settings → Pages → Source = "GitHub Actions" und Repo-Variable PAGES_MODE=actions.
  # Standard ist "Deploy from a branch: main /docs" – dann baut GitHub Pages selbst nach jedem Push.
  deploy:
    needs: build
    if: vars.PAGES_MODE == 'actions' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # der vom build-Job gepushte Commit (nicht der, der den Lauf ausgelöst hat)
          ref: ${{ needs.build.outputs.sha || 'main' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
