<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nicht gefunden · Tippspiel</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f5f2; color: #0b0b0b; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #0d0d0d; color: #f5f5f3; } a { color: #86b6ef; } }
  a { color: #1c5cab; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>Seite nicht gefunden · Pagina non trovata</p>
  <p><a id="home" href="./">Zur Startseite · Alla home</a></p>
</main>
<script>
  // project pages live under /<repo>/ – point the link at the site root
  (function () {
    var seg = location.pathname.split('/').filter(Boolean)[0];
    var base = /\.github\.io$/i.test(location.hostname) && seg && !/\.html?$/i.test(seg) ? '/' + seg + '/' : '/';
    document.getElementById('home').setAttribute('href', base + '#/heute');
  })();
</script>
</body>
</html>
